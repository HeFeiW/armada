defaults:
  - training: train_maniskill_poc
  - _self_

_target_: env_runner.real_env_runner.RealEnvRunner
fps: 10
env_backend: maniskill

# Execution devices
device_ids: '0'

# Model / data paths

# checkpoint_path: /home/tmp_wanghf/armada/outputs/2026.04.04/21.22.42_train_diffusion_transformer_hybrid_dino_multi_gpu_maniskill_pick/checkpoints/latest.ckpt
checkpoint_path: /home/tmp_wanghf/armada/outputs/2026.04.16/21.27.49_train_diffusion_transformer_hybrid_dino_multi_gpu_maniskill_pick/checkpoints/latest.ckpt # this is the checkpoint after training with the new dataset maniskill_pick_fixed_goal_min for about 5 epochs.
train_dataset_path: /home/tmp_wanghf/armada/armada_data/maniskill_pick_fixed_goal_min # TODO: it was maniskill_pick, but we changed to maniskill_pick_fixed_goal_min which set goal pose to a fixed pose to make it easier for failure detection learning.
save_buffer_path: /home/tmp_wanghf/armada/armada_data/maniskill_pick_rollout_poc
output_dir: /home/tmp_wanghf/armada/outputs_rollout/maniskill_poc

# Rollout setup
Ta: 8
random_init: True
seed: 31
debug_policy_freeze_rotation: false

maniskill:
  env_id: PickCube-v1
  num_envs: 2
  obs_mode: rgbd
  control_mode: pd_ee_delta_pose
  render_mode: rgb_array
  max_episode_steps: 300
  seed: ${seed}
  side_camera_name: base_camera
  wrist_camera_name: base_camera
  max_snapshot_steps: 5000
  auto_intervention_steps: ${Ta}
  gripper_max_width: 0.09
  teleop_pos_step: 0.01
  teleop_rot_step_deg: 6.0
  teleop_gripper_step: 0.01
  teleop_rotation_world_frame: true
  teleop_feedback_from_measured_pose: true
  teleop_show_help: true
  teleop_terminal_poll_timeout_s: 0.2
  teleop_no_input_log_interval_s: 2.0
  teleop_input_mode: heuristic #keyboard
  teleop_heuristic:
    debug: true
    max_steps: 256
    exit_on_success: true
    use_cube_pose_for_lift_rotation: false
  success_use_env_info: true
  success_use_pose_check: true
  success_require_static: false
  success_pos_tolerance: 0.03
  success_rot_tolerance_deg: 20.0
  success_target_pose_wxyz: [0.02510096, -0.00136661, 0.2814997, 0.7723232, 0.61468965, 0.15892147, 0.02043187]
  # Keep disabled by default; set true for temporary teleop camera debugging.
  debug_camera_enable: true
  # Original camera setup is unchanged when offsets are [0, 0, 0].
  # Suggested wide-view debug example (left/right + farther):
  # debug_side_camera_offset: [0.0, -0.25, 0.20]
  # debug_wrist_camera_offset: [0.0, 0.25, 0.20]
  debug_side_camera_offset: [0.0, 0.0, 0.0]
  debug_wrist_camera_offset: [0.0, 0.0, 0.0]

# Human-in-loop for simulation
human_loop:
  # auto | manual
  mode: manual
  visualize: true
  window_name: ARMADA ManiSkill Rollout
  on_failure: teleop
  on_timeout: teleop
  prompt_timeout_s: 20
  max_teleop_steps: 64
  max_blocked_rounds: 16

# Failure detection
failure_detection:
  _target_: float.float.FLOAT
  max_queue_size: 3
  num_samples: 1
  num_expert_candidates: 50
  ot_percentile: 95
  initial_ot_threshold: 0.3
  soft_ot_ratio: 0.2
  update_stats: False
  debug_ot_per_step: true
  Ta: ${Ta}
  train_dataset_path: ${train_dataset_path}
  save_buffer_path: ${save_buffer_path}
  output_dir: ${output_dir}
  enable_visualization: True
  To: ${training.n_obs_steps}
  ee_pose_dim: ${training.shape_meta.obs.ee_pose.shape}
  image_shape: ${training.task.image_shape}

policy:
  num_inference_steps: 8
  obs_encoder:
    pretrained_path: null

training:
  output_dir: ${output_dir}
