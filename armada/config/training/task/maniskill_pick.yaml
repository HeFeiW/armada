name: maniskill_pick
image_shape: [3, 224, 224]
dataset_path: /home/tmp_wanghf/armada/armada_data/maniskill_pick

shape_meta: &shape_meta
  obs:
    wrist_img:
      shape: ${....image_shape}
      type: rgb
    side_img:
      shape: ${....image_shape}
      type: rgb
    ee_pose:
      shape: [9]    # [x, y, z, rot_6d[0:6]]
      type: low_dim
      rotation_rep: rotation_6d
  action:
    shape: [10]     # [x, y, z, rot_6d[0:6], gripper]
    rotation_rep: rotation_6d

env_runner:
  _target_: diffusion_policy.env_runner.myrunner.MyRunner

dataset:
  _target_: diffusion_policy.dataset.mydataset.MyDataset
  zarr_path: ${..dataset_path}/replay_buffer.zarr
  horizon: ${...horizon}
  pad_before: ${eval:'${...n_obs_steps}-1'}
  pad_after: ${eval:'${...n_action_steps}-1'}
  seed: 42
  val_ratio: 0.0
  n_obs_steps: ${...n_obs_steps}
  shape_meta: *shape_meta
  random_crop: True
  color_jitter: True
  image_shape: ${..image_shape}
  max_train_episodes: null
